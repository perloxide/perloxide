# Interpreter paths. Each may be overridden by an environment variable named ORACLE_ plus the key in
# upper case (ORACLE_STOCK, ORACLE_THREADS_STOCK, ORACLE_XCHECK, ORACLE_IMPL, ORACLE_TIMEOUT, ...).
# A build whose path is not executable is not run.  The threads_* builds are the second family: the
# oracle for tests that require ithreads, and the configuration cross-check (xconfig) for the rest.
stock              = /opt/perlbrew/perls/perl-5.44.0/bin/perl
noreuse            = /opt/perlbrew/perls/perl-5.44.0-noreuse/bin/perl
descending         = /opt/perlbrew/perls/perl-5.44.0-descending/bin/perl
threads_stock      = /opt/perlbrew/perls/perl-5.44.0-threads/bin/perl
threads_noreuse    = /opt/perlbrew/perls/perl-5.44.0-threads-noreuse/bin/perl
threads_descending = /opt/perlbrew/perls/perl-5.44.0-threads-descending/bin/perl
xcheck             = /usr/bin/perl
timeout            = 60
