# Interpreter paths. Each may be overridden by an environment variable: ORACLE_STOCK, ORACLE_NOREUSE,
# ORACLE_DESCENDING, ORACLE_XCHECK, ORACLE_IMPL, ORACLE_TIMEOUT. A build whose path is not executable is not run.
stock      = /opt/perlbrew/perls/perl-5.44.0/bin/perl
noreuse    = /opt/perlbrew/perls/perl-5.44.0-noreuse/bin/perl
descending = /opt/perlbrew/perls/perl-5.44.0-descending/bin/perl
xcheck     = /usr/bin/perl
timeout    = 60
