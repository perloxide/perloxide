[package]
name = "perloxide-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Perl core types"

[features]
bytes    = ["dep:bytes"]

# The buffer allocation backend (§2.2.3): `jemalloc` is on by default, and in its absence buffers come from the system
# allocator — presence/absence of one additive feature, so cargo's feature unification can never conflict.
default  = ["jemalloc"]
jemalloc = ["dep:tikv-jemalloc-sys"]

[dependencies]
bytes             = { workspace = true, optional = true }
hashbrown         = { workspace = true }
imbl              = { workspace = true, optional = true }
indexmap          = { workspace = true, optional = true }
parking_lot       = { workspace = true }
tikv-jemalloc-sys = { workspace = true, optional = true }

# The process-wide asymmetric barrier (`barrier`) is a system call on each platform that has one.
[target.'cfg(target_os = "linux")'.dependencies]
libc              = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys       = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tikv-jemalloc-ctl = { workspace = true }
