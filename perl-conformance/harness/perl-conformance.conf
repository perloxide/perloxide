# Interpreter paths, one [VERSION] section per supported version (../supported-versions), each holding the six builds of
# that version: the unthreaded stock build and its two allocator-instrumented variants, and the same three built with
# -Dusethreads.  The threads_* builds are the oracle for tests that require ithreads and the configuration cross-check
# (xconfig) for the rest.  Only the target version's section is read (--target, PERL_COMPAT_TARGET, default the newest
# supported version); its keys may be overridden by an environment variable named PERL_COMPAT_ plus the key in upper
# case (PERL_COMPAT_STOCK, PERL_COMPAT_THREADS_STOCK, ...), as may PERL_COMPAT_IMPL and PERL_COMPAT_TIMEOUT.  A build
# whose path is not executable is not run.  A Perl that is not a supported version is never listed here; it is run as an
# implementation with `oracle check --impl PATH`.
timeout = 60

[5.44.0]
stock              = /opt/perlbrew/perls/perl-5.44.0/bin/perl
noreuse            = /opt/perlbrew/perls/perl-5.44.0-noreuse/bin/perl
descending         = /opt/perlbrew/perls/perl-5.44.0-descending/bin/perl
threads_stock      = /opt/perlbrew/perls/perl-5.44.0-threads/bin/perl
threads_noreuse    = /opt/perlbrew/perls/perl-5.44.0-threads-noreuse/bin/perl
threads_descending = /opt/perlbrew/perls/perl-5.44.0-threads-descending/bin/perl
